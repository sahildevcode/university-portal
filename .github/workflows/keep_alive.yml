name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes (cron format: minute hour day-of-month month day-of-week)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PKC Render Backend
        run: |
          echo "Pinging PKC University Backend to prevent sleep..."
          curl -s -f -m 30 https://pkc-university-api.onrender.com/api/health || echo "Ping attempted"
